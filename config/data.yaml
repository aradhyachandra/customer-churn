# Raw data and file locations. Paths are relative to the repo root.

raw:
  path: data/raw/online_retail_II.xlsx
  source: "UCI Machine Learning Repository, dataset 502, Online Retail II (CC BY 4.0)"
  download_url: https://archive.ics.uci.edu/static/public/502/online+retail+ii.zip
  downloaded_on: 2026-10-13
  # sha256 of the extracted .xlsx; the loader refuses to run if the file differs.
  sha256: bcbe73b35f5b7babf197fb0cb983a11f5d9ff929078d4aa53d171b1f2df2e980
  # Sheet order matters: the overlap check drops lines in the later sheet that repeat the earlier one.
  sheets:
    - "Year 2009-2010"
    - "Year 2010-2011"

paths:
  cache_dir: data/processed                                 # raw_sheets_<sha12>.parquet
  clean_transactions: data/processed/transactions_clean.parquet
  cleaning_report: results/c1_cleaning_report.json
  doc_template: docs/templates/C1_data_and_cleaning.md
  doc_output: docs/C1_data_and_cleaning.md
  # C2 outputs (small tables and figures are committed; parquet stays in data/processed/)
  customer_months: data/processed/customer_months.parquet
  c2_report: results/c2_cohorts_and_churn.json
  c2_cohort_summary: results/c2_cohort_summary.csv
  c2_retention_counts: results/c2_retention_counts.csv
  c2_retention_rates: results/c2_retention_rates.csv
  c2_churn_by_cutoff: results/c2_churn_by_cutoff.csv
  c2_churn_sensitivity: results/c2_churn_sensitivity.csv
  c2_heatmap: results/figures/c2_retention_heatmap.png
  c2_doc_template: docs/templates/C2_cohorts_and_churn.md
  c2_doc_output: docs/C2_cohorts_and_churn.md
  # C3 outputs (snapshot tables stay in data/processed/; the report and summary are committed)
  snapshots_dir: data/processed/snapshots                    # snapshot_<cutoff>.parquet
  c3_report: results/c3_features.json
  c3_feature_summary: results/c3_feature_summary_training.csv
  c3_doc_template: docs/templates/C3_snapshots_and_features.md
  c3_doc_output: docs/C3_snapshots_and_features.md
